name: Water + Boil + Burn (Daily 6:30 AM CT)

on:
  schedule:
    # Two slots a day (11:17 and 14:17 UTC = 6:17/9:17 AM CDT, 5:17/8:17 AM CST). GitHub often
    # starts :00/:30 jobs hours late; odd minutes and a second slot keep the data under 24 h old.
    # The shared concurrency group serializes commits across every data workflow.
    - cron: '17 11 * * *'
    - cron: '17 14 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pops-data-commit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Get Playwright version
        id: pw-version
        run: |
          echo "version=$(python -c 'import playwright; print(playwright.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright Chromium binary (always — idempotent when cached)
        # NOT gated on cache hit. When Playwright Python bumps its required
        # Chromium build (chrome-headless-shell-XXXX) without changing its
        # own version string, the cache key still matches but the binary it
        # holds is the wrong build — launch() fails with "Executable doesn't
        # exist." `playwright install` is a no-op when the right binary is
        # already at the expected path, so always running it is safe.
        run: python -m playwright install chromium

      - name: Install Playwright OS dependencies (always — fresh VM each run)
        run: python -m playwright install-deps chromium

      - name: Run water check
        env:
          TZ: America/Chicago
        run: python scripts/water_check.py

      - name: Commit data/ if anything changed
        # always(): commit whatever was checked even on a partial-fetch day
        # (the script exits nonzero then, which still flags the run as failed).
        if: always()
        run: |
          git config user.name  "popsguide-bot"
          git config user.email "popsguide-bot@users.noreply.github.com"
          git add data/
          if git diff --quiet --cached; then
            echo "No data changes; skipping commit."
          else
            git commit -m "auto(water-daily): refresh at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            # Serialize with every other data workflow (shared concurrency group) and retry the push:
            # a parallel commit from another workflow used to reject this push.
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              echo "push attempt $i failed; retrying"; sleep $((i*10))
            done
            git push || { echo 'push failed after retries'; exit 1; }
          fi
